name: CI

# Pull requests, pushes to main and manual runs. A new push cancels the run it replaces, and a push to a branch with an open pull request runs once (as the pull request), not twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  # The UI suites drive the real built app under a virtual display and take a long time one after another, so each suite is its own job and they run side by side.
  ui:
    name: UI ${{ matrix.suite }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [ui-analysis, ui-batch1, ui-launcher, ui-launcher2, ui-layout, ui-quality, ui-replay, ui-sim, ui-team, ui-testing, ui-tune, ui-view, robot-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-pil libnss3 libgbm1 libasound2t64 libgtk-3-0t64 x11-utils imagemagick
      - run: npm ci
      # npm ci does not always fetch Electron's binary (the log showed dist/electron missing): fetch it explicitly, and fail here if it is still not there
      - run: node node_modules/electron/install.js && test -x node_modules/electron/dist/electron
      - run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
      - run: bash e2e/run.sh ${{ matrix.suite }}
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          E2E_DIR: ${{ runner.temp }}/crucible-e2e
          E2E_VERBOSE: '1'
          E2E_SLOW: '2.5'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failures-${{ matrix.suite }}
          path: ${{ runner.temp }}/crucible-e2e/e2e/
          if-no-files-found: ignore
