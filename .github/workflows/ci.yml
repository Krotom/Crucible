name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  ui:
    name: UI tests (Electron under a virtual display)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-pil libnss3 libgbm1 libasound2t64 libgtk-3-0t64 x11-utils imagemagick
      - run: npm ci
      # npm ci does not always fetch Electron's binary (the log showed dist/electron missing): fetch it explicitly, and fail here if it is still not there
      - run: node node_modules/electron/install.js && test -x node_modules/electron/dist/electron
      - run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
      - run: bash e2e/run.sh
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          E2E_DIR: ${{ runner.temp }}/crucible-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failures
          path: ${{ runner.temp }}/crucible-e2e/e2e/
          if-no-files-found: ignore
