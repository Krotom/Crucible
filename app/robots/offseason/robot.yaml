# Robot definition: OffSeason (Team 10213). Physical parameters the simulation needs.
# Each value says where it comes from: CODE = the robot project's constants (checked against the robot at connect time),
# CAD = measured from montaj.glb, GUESS = a placeholder to measure. Units: meters, kilograms, seconds, rotations.
robot: OffSeason
version: 1

chassis:
  mass: 52                  # GUESS: robot with bumpers and battery, kg
  bumper: [0.43, 0.43, 0.12]  # GUESS: bumper footprint half extents x, y and collider height
  moi: 6.0                  # GUESS: yaw moment of inertia, kg*m^2 (a uniform 52 kg plate of this footprint is 6.4)
  friction: 0.45            # GUESS: bumper fabric (wall contact multiplies it with the wall's 0.8, bumper on bumper averages)
  restitution: 0.25         # GUESS: bumpers absorb most of an impact
  chamfer: 0.04             # GUESS: bumper corner radius, modeled as a chamfer
  start: { x: 1.0, y: 1.0, yaw: 0.0 }

swerve:
  wheelRadius: 0.0508       # CODE TunerConstants: 2 in
  driveRatio: 7.03125       # CODE
  steerRatio: 26.09090909090909  # CODE
  couplingRatio: 4.5        # CODE
  driveMotor: krakenX60     # CODE (CTRE sim default for swerve)
  steerMotor: krakenX60
  driveInertia: 0.01        # CODE kDriveInertia
  steerInertia: 0.01        # CODE kSteerInertia
  driveFrictionVolts: 0.2   # CODE
  steerFrictionVolts: 0.2   # CODE
  driveCurrentLimit: 120    # CODE kSlipCurrent
  steerCurrentLimit: 60     # CODE
  mu: 1.2                   # GUESS: tread on carpet
  slipSpeed: 0.05           # tire stiffness knob
  pigeonId: 1
  modules:                  # CODE: +-11.415 in
    - { x: 0.28994, y: 0.28994, driveId: 20, steerId: 21, encoderId: 22 }    # front left
    - { x: 0.28994, y: -0.28994, driveId: 23, steerId: 24, encoderId: 25 }   # front right
    - { x: -0.28994, y: 0.28994, driveId: 26, steerId: 27, encoderId: 28 }   # back left
    - { x: -0.28994, y: -0.28994, driveId: 29, steerId: 30, encoderId: 31 }  # back right

# Mechanisms driven by a single (lead) Talon. motor/count/gearRatio are checked against what the robot code registers;
# inertia values are the robot code's own guesses (GUESS) until measured from the CAD. Optional per mechanism:
#   frictionVolts: voltage deadband standing in for friction (default 0, like the old DCMotorSim)
#   limits: { min, max }  hard stops in mechanism rotations (default none, like the old DCMotorSim)
mechanisms:
  - { id: 8,  name: turret,        motor: krakenX60, count: 1, gearRatio: 46.5,    inertia: 0.1 }
  - { id: 37, name: shooter,       motor: krakenX60, count: 3, gearRatio: 2.0,     inertia: 0.01 }
  - { id: 38, name: feeder,        motor: krakenX60, count: 1, gearRatio: 2.0,     inertia: 0.003 }
  - { id: 39, name: indexer,       motor: krakenX60, count: 1, gearRatio: 1.0,     inertia: 0.002 }
  - { id: 40, name: hood,          motor: krakenX44, count: 1, gearRatio: 16.40625, inertia: 0.02 }
  # Intake slide: 0.0785 m of rack travel per driver rotation, 0.293 m of travel = 3.73 rotations (CAD). Left without
  # hard stops because the robot code's open setpoint (10 rot) is beyond the travel; add limits: { min: 0, max: 3.73 } when
  # the setpoints are corrected.
  - { id: 33, name: intakeDriver,  motor: krakenX60, count: 2, gearRatio: 3.75,    inertia: 0.002 }
  - { id: 35, name: intakeRoller,  motor: krakenX60, count: 1, gearRatio: 1.4,     inertia: 0.005 }

# Ball handling (the hybrid ball model): the intake capture volume, the stages a piece rides through, the beam breaks and the
# shooter. All of it is GUESS until measured from the CAD and the robot: the box and stage lengths follow the CAD intake
# (rollers near x 0.6) loosely; roller radius 1 in; wheel radius 2.25 in compliant wheels / 2; efficiency, exit elevation
# and backspin are the shot-calibration knobs (milestone M12).
ballHandling:
  piece: ball
  preload: 3                    # GUESS: FUEL loaded before the match (the rules allow up to 8)
  intake:
    driver: intakeDriver
    metersPerRotation: 0.0785   # CAD: 10-tooth pinion, 25 mm pitch diameter
    travel: 0.293               # CAD: the open pose
    slideAxis: [0.98370, 0.0, -0.17967]   # CAD: 10.35 deg below horizontal
    openBox: { center: [0.56, 0.0, 0.11], half: [0.16, 0.32, 0.12] }
    minExtension: 0.8
    roller: intakeRoller
    rollerRadius: 0.0254
    rollerDirection: 1
    minRollerRps: 5
    maxRelativeSpeed: 4.0
  # a stage moves at the summed surface speed of its drivers; the intake roller feeds the first stage while intaking and the indexer
  # (which the code runs negative to feed) moves everything forward while shooting. Order from the team (not confirmed):
  # intake -> revolver/spindexer (the indexer motor) -> feeder -> turret -> shooter. The CAD's "revolver" subassembly is a drum with
  # its own reduction that this straight queue only approximates.
  stages:
    - name: intake
      length: 0.30
      drivers:
        - { driver: intakeRoller, direction: 1,  radius: 0.0254 }
        - { driver: indexer,      direction: -1, radius: 0.0254 }
    - name: revolver
      length: 0.40
      drivers:
        - { driver: indexer, direction: -1, radius: 0.0254 }
    - name: feeder
      length: 0.25
      drivers:
        - { driver: feeder, direction: 1, radius: 0.0254 }
  beams:
    - { name: revolverEntry, position: 0.30 }
    - { name: feederEntry,  position: 0.70 }
    - { name: exit,         position: 0.95 }
  shooter:
    turret: turret
    hood: hood
    flywheel: shooter
    axis: [-0.137, -0.1364]     # CAD: turret ring gear center
    exitForward: 0.15
    exitHeight: 0.62
    wheelRadius: 0.0286
    efficiency: 0.85            # GUESS: the value at which the robot code's own shot tables (distance to shooter speed and hood angle) score from about 1.6 to 4 m in the sim; 0.7 fell short from 2.4 m on. Not measured: fit it to real shots (Tune > Calibration)
    elevationAtHoodZeroDeg: 80
    hoodDegPerRotation: 10      # Mechanism3d
    backspin: 0.2
    minFeedSpeed: 0.5
    minFlywheelRps: 5
